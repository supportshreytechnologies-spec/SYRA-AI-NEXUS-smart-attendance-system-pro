<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYRA - Reset Password</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="auth"><section class="card"><h1>RESET PASSWORD</h1><p>Choose a new password for your SYRA account.</p><form id="resetForm"><label>New password<input id="password" type="password" minlength="6" required autocomplete="new-password"></label><label>Confirm password<input id="confirm" type="password" minlength="6" required autocomplete="new-password"></label><button class="primary">RESET PASSWORD</button></form><p id="msg"></p><a href="/">Back to login</a></section></main><script>const token={{ token|tojson }};document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c){msg.textContent='Passwords do not match.';return}const r=await fetch('/api/reset/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});const j=await r.json();msg.textContent=j.message||j.error;if(j.ok)setTimeout(()=>location.href='/',1200)});</script></body></html>
